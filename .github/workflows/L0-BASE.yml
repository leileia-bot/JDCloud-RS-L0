# L0 底座固件：京东云亚瑟 AX1800 Pro（qualcommax/ipq60xx）
# 单一栈：无 NSS / nftables / dnsmasq-full / vantage 主题 / ext4 U盘层
# 产物：squashfs sysupgrade + factory.bin + .manifest + 最终 .config

name: L0-BASE

on:
  workflow_dispatch:
    inputs:
      TEST:
        description: '仅生成并校验配置，不编译'
        type: boolean
        default: false
        required: false
      WIFI_FW:
        description: '无线固件包：qca25=官方 2.5.0.1-03982 ｜ ddwrt212=DD-WRT 2.12-01460'
        type: choice
        options:
          - qca25
          - ddwrt212
        default: qca25
        required: true
      ALL_KMODS:
        description: '全量内核模块（编进固件，不发独立 kmod 包）'
        type: boolean
        default: false
        required: false
      ONLY_PKG:
        description: '调试：只编指定包（如 package/network/services/dnsmasq），留空=完整编译'
        type: string
        default: ''
        required: false

env:
  SOURCE_REPO: https://github.com/VIKINGYFY/immortalwrt.git
  SOURCE_BRANCH: owrt
  WRT_CONFIG: L0-AX1800
  WRT_DATE: ${{ github.run_id }}

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Host
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -yqq purge firefox >/dev/null 2>&1 || true
          sudo apt-get -yqq update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang cmake cpio \
            curl device-tree-compiler dos2unix file flex g++-multilib gawk gcc-multilib \
            genisoimage gettext git jq libelf-dev libncurses-dev libssl-dev lld llvm \
            ninja-build patch perl pkgconf python3 python3-dev python3-pyelftools \
            rsync swig unzip wget xz-utils zlib1g-dev zstd \
            dwarves
          sudo timedatectl set-timezone Asia/Shanghai

      - name: Clone Source
        run: |
          git clone --depth=1 --single-branch -b "$SOURCE_BRANCH" "$SOURCE_REPO" ./wrt
          cd ./wrt
          echo "SRC_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Feeds
        run: |
          cd ./wrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Vantage Theme
        run: |
          git clone --depth=1 https://github.com/anothaDev/luci-theme-vantage.git /tmp/vantage
          cp -r /tmp/vantage/luci-theme-vantage ./wrt/package/
          test -f ./wrt/package/luci-theme-vantage/Makefile

      - name: Kernel Slot（12M，设备实测可用）
        run: |
          cd ./wrt
          MK=./target/linux/qualcommax/image/ipq60xx.mk
          echo "==== 内核槽 → 12288k（这块板的内核区实测 12M 可用，2.5 版固件已验证） ===="
          sed -i -E 's/(KERNEL_SIZE\s*:=\s*)[0-9]+k/\112288k/' "$MK"
          grep -n "KERNEL_SIZE" "$MK" | head
          grep -q "KERNEL_SIZE := 12288k" "$MK" || { echo "失败: 内核槽没改成 12288k"; exit 1; }

      - name: 无线固件包（${{ inputs.WIFI_FW }}）
        run: |
          cd ./wrt
          TM=./target/linux/qualcommax/ipq60xx/target.mk
          QCA=./package/firmware/linux-firmware/qca_ath11k.mk
          MODE="${{ inputs.WIFI_FW }}"
          echo "无线固件模式: $MODE"

          if [ "$MODE" = "qca25" ]; then
            # 上游 QCA ath11k-firmware 包：安装 IPQ6018/hw1.0/2.5.0.1/WLAN.HK.2.5.0.1-03982
            curl -fsSL "https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/package/firmware/ath11k-firmware/Makefile" \
              -o ./package/firmware/ath11k-firmware/Makefile
            grep -E "PKG_SOURCE_URL|2\.5\.0\.1-03982" ./package/firmware/ath11k-firmware/Makefile | head
            # linux-firmware 里同名的 ipq6018 段必须删掉（否则同名包重复定义，且会带 2.7.0.1）
            perl -0pi -e 's{Package/ath11k-firmware-ipq6018 = .*?\$\(eval \$\(call BuildPackage,ath11k-firmware-ipq6018\)\)\n\n?}{}s' "$QCA"
            grep -c "ath11k-firmware-ipq6018" "$QCA" || echo "OK: linux-firmware 已不提供 ipq6018"
            sed -i 's/ath11k-firmware-ipq6018-ddwrt kmod-nss-wifi-drv/ath11k-firmware-ipq6018/' "$TM"
          else
            # 保留源默认的 ddwrt 固件，只剔掉 NSS wifi 驱动
            sed -i 's/ath11k-firmware-ipq6018-ddwrt kmod-nss-wifi-drv/ath11k-firmware-ipq6018-ddwrt/' "$TM"
          fi
          grep -n "ath11k" "$TM" | head

      - name: Apply Config
        run: |
          cd ./wrt
          [ -d ../files ] && cp -rf ../files/. ./
          cat "../Config/$WRT_CONFIG.txt" >> .config
          MODE="${{ inputs.WIFI_FW }}"
          if [ "$MODE" = "qca25" ]; then
            echo "CONFIG_PACKAGE_ath11k-firmware-ipq6018=y" >> .config
            echo "# CONFIG_PACKAGE_ath11k-firmware-ipq6018-ddwrt is not set" >> .config
          else
            echo "# CONFIG_PACKAGE_ath11k-firmware-ipq6018 is not set" >> .config
            echo "CONFIG_PACKAGE_ath11k-firmware-ipq6018-ddwrt=y" >> .config
          fi
          if [ "${{ inputs.ALL_KMODS }}" = "true" ]; then
            echo "CONFIG_ALL_KMODS=y" >> .config
          fi
          make defconfig -j$(nproc)
          # defconfig 会把默认选的 nss 驱动拉回来，这里二次压制
          sed -i 's/^CONFIG_PACKAGE_kmod-nss-wifi-drv=y/# CONFIG_PACKAGE_kmod-nss-wifi-drv is not set/' .config
          sed -i 's/^CONFIG_ATH11K_NSS_WIFI=y/# CONFIG_ATH11K_NSS_WIFI is not set/' .config

          # ==== 全量 kmod：m → y，把模块编进镜像，不再单独发 kmod 包 ====
          # 排除名单（二选一已按"底座已验证的那套"定案，含关联包）
          #   kmod-nss-wifi-drv   NSS 必须关（daed/透明代理要过 netfilter）
          #   kmod-fs-afs/ntfs3   不用；ntfs3 与内核内置重叠
          #   r8152               与 kmod-usb-net-rtl8152 同类二选一 → 留后者（走 usb-net 框架）
          #   kmod-ath10k / -ct   设备是 ath11k，ath10k 两套整族剔除（含固件层不选）
          #   wpad 变体族         只留 wpad-openssl，避免加密库全家桶互斥
          #   selinux 变体族      不用 SELinux，整族剔除，防止"装了变体没装框架"
          #   firewall(fw3)       走 fw4 线；apk-mbedtls 让位 apk-openssl
          #   !! nftables-json 绝对不能剔：它提供 nft 二进制 + libnftables.so.1，
          #      firewall4 和 dnsmasq_full_nftset 都要它，剔掉会让 dnsmasq 打包报
          #      "missing dependencies: libnftables.so.1"（本轮 45925641337 的真因）
          #   rtl826x-firmware    该树模板 bug（自我冲突），永远装不上
          #   ipt-chaos/delude/tarpit（xtables-addons 反扫描三件套，chaos 依赖 delude+tarpit，
          #     必须整组一起剔）、ipt-lua/psd/lscan/asn：无任何向外反向依赖，用户态
          #     iptables-mod-* 全部未选中，iptables 二进制本身也没进固件 → 纯死重
          #   crypto-hw-padlock/hifn-795x/atmel：x86 VIA CPU / PCIe 加密卡 / I2C 加密芯片，
          #     亚瑟三样硬件都没有，反向依赖 0
          #   crypto-md4/rmd160/fcrypt/pcbc/michael-mic/arc4：冷门或已废弃算法，反向依赖 0；
          #     !! 注意 arc4 砍的是 CONFIG_CRYPTO_ARC4（AF_ALG 封装），mac80211 select 的是
          #     CRYPTO_LIB_ARC4（内核 lib/arc4.c），WiFi WEP/TKIP 不受影响
          #   crypto-chacha20poly1305：与 crypto-lib-chacha20poly1305（WireGuard 实际使用者）重复
          #   kmod-cryptodev：/dev/crypto 用户态接口，固件内无任何程序使用
          # 调度族（22 个，必须成组）：kmod-sched 正向依赖 ets/gred/act-pedit，netem 又依赖
          #   kmod-sched → 这 5 个是一条链，只砍一半会留下悬空依赖。保留 sched-core（HTB/TBF/
          #   ingress/cls_act 底座）、cake（SQM 主算法）、pie/fq-pie/red、flower。
          #   !! fq_codel 不在这些包里，target 基线 CONFIG_DEFAULT_FQ_CODEL=y 自带，砍了不掉队列算法
          #   !! 改用 SQM（cake + ifb + nftables，纯用户态），不再装 trafficshaper，
          #     因此 kmod-sched-connmark 回砍（SQM 不需要它）
          #   !! kmod-sched-bpf 不砍（cls_bpf.ko + act_bpf.ko）：daed/dae 的 eBPF 若走 tc 挂载，
          #     这是 tc 侧唯一的 eBPF 载体，而本项目的 BTF 就是为了 dae/daed，砍了可能直接起不来；
          #     体积很小，留着买保险
          # 文件系统（4 个）：udf/isofs（挂光盘/ISO 镜像）、minix（老 Minix）、nilfs2（停更日志FS）
          #   ext4/vfat/msdos/exfat/f2fs/btrfs/cifs/ksmbd/nfs/squashfs 全部保留
          # nls 编码（14 个）：中欧/西里尔/希腊/希伯来/冰岛/日文SJIS/繁体BIG5 代码页
          #   保留 base/utf8/cp437/iso8859-1/iso8859-15/ucs2-utils/cp936（GBK）
          BLACKLIST="kmod-nss-wifi-drv kmod-fs-afs kmod-fs-ntfs3 r8152 \
            kmod-ath10k kmod-ath10k-ct \
            wpad-basic-mbedtls wpad-basic-wolfssl wpad-wolfssl \
            firewall apk-mbedtls procd-selinux busybox-selinux \
            uencrypt-openssl uencrypt-wolfssl \
            f2fs-tools-selinux mkf2fs-selinux f2fsck-selinux libf2fs-selinux \
            libwolfsslcpu-crypto rtl826x-firmware \
            ath10k-firmware-qca988x ath10k-firmware-qca9887 ath10k-firmware-qca99x0 \
            ath10k-firmware-qca9984 ath10k-firmware-qca4019 ath10k-firmware-qca9888 \
            ath10k-firmware-qca6174 ath10k-firmware-qca9377 \
            kmod-usb-net-rtl8152-vendor \
            kmod-lkdtm kmod-pktgen kmod-bpf-test \
            kmod-crypto-test kmod-mtdtests \
            v4l2loopback dmx_usb_module \
            kmod-usb-net-asix kmod-usb-net-asix-ax88179 kmod-usb-net-smsc95xx \
            kmod-usb-net-lan78xx kmod-usb-net-kaweth kmod-usb-net-pegasus \
            kmod-usb-hid-mcp2221 \
            kmod-ipt-chaos kmod-ipt-delude kmod-ipt-tarpit \
            kmod-ipt-lua kmod-ipt-psd kmod-ipt-lscan kmod-ipt-asn \
            kmod-crypto-hw-padlock kmod-crypto-hw-hifn-795x kmod-crypto-hw-atmel \
            kmod-crypto-md4 kmod-crypto-rmd160 kmod-crypto-fcrypt \
            kmod-crypto-pcbc kmod-crypto-michael-mic kmod-crypto-arc4 \
            kmod-crypto-chacha20poly1305 kmod-cryptodev \
            kmod-sched kmod-netem kmod-sched-ets kmod-sched-gred kmod-sched-act-pedit \
            kmod-sched-cbs kmod-sched-etf kmod-sched-taprio kmod-sched-mqprio \
            kmod-sched-mqprio-common kmod-sched-dualpi2 kmod-sched-drr kmod-sched-prio \
            kmod-sched-skbprio kmod-sched-act-gate kmod-sched-act-police \
            kmod-sched-act-sample kmod-sched-act-vlan \
            kmod-sched-ctinfo kmod-sched-connmark kmod-sched-ipset \
            kmod-fs-udf kmod-fs-isofs kmod-fs-minix kmod-fs-nilfs2 \
            kmod-nls-cp1250 kmod-nls-cp1251 kmod-nls-cp775 kmod-nls-cp850 \
            kmod-nls-cp852 kmod-nls-cp862 kmod-nls-cp864 kmod-nls-cp866 \
            kmod-nls-cp932 kmod-nls-cp950 kmod-nls-iso8859-2 kmod-nls-iso8859-6 \
            kmod-nls-iso8859-8 kmod-nls-iso8859-13 kmod-nls-koi8r \
            kmod-fs-9p kmod-hci-uart kmod-usb-audio"

          # ==== TRIM：剔除"路由器上用不到"的整族驱动，给 BTF 腾内核槽空间 ====
          # 只砍与网络/存储/代理链路无关的设备族；网络类一个不动。
          # 明确保留（不要往 TRIM 里加）：dm（Docker device-mapper）、md（软 RAID）、
          #   cifs（挂 SMB）、nfs（挂 NFS）、btrfs/f2fs（群晖/手机盘直插识别）、
          #   watchdog（死机自重启）、hwmon（IPQ6000 温度读取）
          TRIM_RE='kmod-(dvb|bluetooth|bt|uhid|sound|snd|video|media|uvc|can|isdn|hamradio|firewire|thunderbolt|pcmcia|infiniband|rdma|joystick|nfc|w1|drbd|xfs|jfs|hfs|reiserfs|9p|erofs|gpu|drm|rc-|ir-|iio|industrialio|input-adc-keys)'
          # 注意：gpio / i2c / spi 不在 TRIM 里（会引入大量 .ko 依赖；kmod-igb 缺 i2c-algo-bit.ko
          # 就是这么炸的），改用整族黑名单精确剔除设备驱动本身
          # 非本机 PCIe / 服务器网卡整族（亚瑟无 PCIe 槽，有线走内置 PHY）：
          # 592 个里挑出 60 个常见卡，一起剔掉能顺带消掉 igb/ixgbe 这类"驱动在、依赖没了"的连环报错
          NIC_RE='kmod-(3c59x|8139cp|8139too|alx|atl1|atl1c|atl1e|atl2|atlantic|b44|be2net|bnx2|bnx2x|bnxt-en|dm9000|e100|e1000|e1000e|enc28j60|et131x|ethoc|forcedeth|i40e|iavf|ice|igb|igc|ixgbe|ixgbevf|lan743x|mlx4-core|mlx5-core|mlxfw|natsemi|ne2k-pci|niu|pcnet32|qede|qlcnic|r6040|r8101|r8125|r8126|r8127|r8168|r8169|renesas-rzn-pcs|sfc|sfc-falcon|sfc-siena|sis190|sis900|skge|sky2|solos-pci|tg3|tulip|via-rhine|via-velocity|vmxnet3)'
          trim_uncommon() {
            echo "==== TRIM：剔除不常用设备族 ===="
            local before after
            before=$(grep -c '^CONFIG_PACKAGE_kmod-[A-Za-z0-9_.+-]*=y' .config || true)
            # 逐条把整族 =y/=m 压成 not set
            for k in $(grep -oE '^CONFIG_PACKAGE_kmod-[A-Za-z0-9_.+-]*=[ym]' .config | sed 's/^CONFIG_PACKAGE_//;s/=[ym]//'); do
              if echo "$k" | grep -qE "^($TRIM_RE)"; then
                sed -i "s/^CONFIG_PACKAGE_${k//./\\.}=[ym]$/# CONFIG_PACKAGE_${k} is not set/" .config
              fi
            done
            after=$(grep -c '^CONFIG_PACKAGE_kmod-[A-Za-z0-9_.+-]*=y' .config || true)
            echo "TRIM: kmod 内建 $before → $after（少 $((before-after)) 个）"
          }

          # 第二批「板子上没这个硬件」精确剔除名单（235 项，见 ../Config/kmod-cut-extra.txt）
          cut_extra() {
            [ -f ../Config/kmod-cut-extra.txt ] || { echo "!! 缺 ../Config/kmod-cut-extra.txt"; exit 1; }
            local n=0 p
            while read -r p; do
              [ -z "$p" ] && continue
              case "$p" in \#*) continue;; esac
              sed -i "s/^CONFIG_PACKAGE_${p}=[my]$/# CONFIG_PACKAGE_${p} is not set/" .config
              grep -q "^# CONFIG_PACKAGE_${p} is not set" .config || echo "# CONFIG_PACKAGE_${p} is not set" >> .config
              n=$((n+1))
            done < ../Config/kmod-cut-extra.txt
            echo "cut_extra: 压制 $n 项"
          }

          apply_blacklist() {
            # 变体族整族压制：ath10k 有 -ct / -sdio / -smallbuffers 多个同源包，
            # 它们都提供 ath10k_core.ko，只按名字逐个剔会漏掉变体 → 安装时 file overwrite 冲突
            # （本轮真因：kmod-ath10k-smallbuffers / -sdio 试图覆盖 kmod-ath10k-ct-smallbuffers 的 .ko）
            sed -i -E 's/^CONFIG_PACKAGE_(kmod-ath10k[A-Za-z0-9._-]*)=[my]$/# CONFIG_PACKAGE_\1 is not set/' .config
            # 非本机 PCIe 网卡整族（没有 PCIe 槽就必须全族一起走，不能只走一半）
            sed -i -E 's/^CONFIG_PACKAGE_('"${NIC_RE}"')[A-Za-z0-9._-]*=[my]$/# CONFIG_PACKAGE_\1 is not set/' .config
            # IIO 工业/环境传感器整族（板子无对外 I2C/SPI 传感器接口，温度走 hwmon/TSENS）
            sed -i -E 's/^CONFIG_PACKAGE_(kmod-iio[A-Za-z0-9._-]*|kmod-industrialio[A-Za-z0-9._-]*|kmod-input-adc-keys|kmod-usb-hid-mcp2221)=[my]$/# CONFIG_PACKAGE_\1 is not set/' .config
            # 外置 Realtek WiFi 网卡整族：rtw88/rtw89/老 rtl8xxx 共 51 个驱动 + 30 个固件
            # 正则边界要点：锚定 ^CONFIG_PACKAGE_kmod-(rtw|rtl)[0-9]，且 [0-9] 后面必须跟
            #   [A-Za-z0-9._-]*（不然 rtw88 这种"双数字结尾"会漏，之前干跑就踩过）
            #   这样 kmod-usb-net-rtl8150/rtl8152（USB 有线网卡）、kmod-dsa-rtl8365mb、
            #   kmod-switch-rtl8306/8366/8367（交换机芯片）都不会被误伤
            sed -i -E 's/^CONFIG_PACKAGE_(kmod-(rtw|rtl)[0-9][A-Za-z0-9._-]*|rtl[0-9][A-Za-z0-9._-]*-firmware)=[my]$/# CONFIG_PACKAGE_\1 is not set/' .config
            for p in $BLACKLIST; do
              sed -i "s/^CONFIG_PACKAGE_${p}=[my]\$/# CONFIG_PACKAGE_${p} is not set/" .config
              grep -q "^# CONFIG_PACKAGE_${p} is not set" .config || \
                echo "# CONFIG_PACKAGE_${p} is not set" >> .config
            done
          }

          if [ "${{ inputs.ALL_KMODS }}" = "true" ]; then
            echo "==== [全量kmod 1/3] m → y ===="
            sed -i 's/^CONFIG_PACKAGE_\(kmod-[A-Za-z0-9_.-]*\)=m$/CONFIG_PACKAGE_\1=y/' .config
            echo "==== [全量kmod 2/3] 套排除名单 + 二次 defconfig（解依赖/收敛 select） ===="
            apply_blacklist
            cut_extra
            make defconfig -j$(nproc)
            echo "==== [全量kmod 3/3] 再压一遍，防止 luci-app-* 的 select 把变体拉回 ===="
            apply_blacklist
            trim_uncommon
            cut_extra
            make defconfig -j$(nproc)
            apply_blacklist
            trim_uncommon
            cut_extra
            echo "选中 kmod (y): $(grep -c '^CONFIG_PACKAGE_kmod.*=y' .config)"
            echo "模块 kmod (m): $(grep -c '^CONFIG_PACKAGE_kmod.*=m' .config)"
            KY=$(grep -c '^CONFIG_PACKAGE_kmod.*=y' .config)
            # 门槛说明：基线全量 1133 个，本轮按硬件精确剔除约 575 个（cut_extra 235 + 各整族），合理余量 554
            # 阈值取 450 —— 只用来抓「ALL_KMODS 根本没生效」这种崩盘，不跟正常剔除对撞
            [ "$KY" -ge 450 ] || { echo "失败: kmod 内建数只有 $KY，全量没生效"; exit 1; }
            # 全量生效的独立佐证：这些包与剔除无关，缺了说明全量没铺开
            for p in kmod-ath11k-ahb kmod-cfg80211 kmod-mac80211 kmod-usb-core kmod-nf-conntrack kmod-nft-core kmod-crypto-gcm kmod-crypto-ccm kmod-sched-core kmod-lib-crc32c; do
              grep -q "^CONFIG_PACKAGE_${p}=y" .config || { echo "失败: 全量标志包 $p 缺失"; exit 1; }
            done
            # 硬断言：ath10k 变体族必须一个不剩（否则 install 阶段必然 file overwrite）
            BAD=$(grep -cE '^CONFIG_PACKAGE_kmod-ath10k[A-Za-z0-9._-]*=y' .config || true)
            echo "残留 ath10k 变体(y): $BAD"
            [ "$BAD" = "0" ] || { grep -E '^CONFIG_PACKAGE_kmod-ath10k[A-Za-z0-9._-]*=y' .config; echo "失败: ath10k 变体族仍有选中，install 会 file overwrite"; exit 1; }
            # 硬断言：外置 Realtek WiFi 族（驱动 + 固件）必须一个不剩
            BADR=$(grep -cE '^CONFIG_PACKAGE_(kmod-(rtw|rtl)[0-9][A-Za-z0-9._-]*|rtl[0-9][A-Za-z0-9._-]*-firmware)=[ym]' .config || true)
            echo "残留 Realtek 外置网卡族(y/m): $BADR"
            [ "$BADR" = "0" ] || { grep -E '^CONFIG_PACKAGE_(kmod-(rtw|rtl)[0-9][A-Za-z0-9._-]*|rtl[0-9][A-Za-z0-9._-]*-firmware)=[ym]' .config; echo "失败: Realtek 外置网卡族仍有选中"; exit 1; }
            for p in kmod-usb-net-rtl8152 kmod-usb-net-rtl8150; do
              grep -q "^# CONFIG_PACKAGE_${p} is not set" .config && echo "  !! 误伤 ${p}" || echo "  OK 未误伤 ${p}"
            done
            # cut_extra 名单必须全清（读名单逐个查 y/m 残留）
            BADE=0
            while read -r p; do
              [ -z "$p" ] && continue
              case "$p" in \#*) continue;; esac
              grep -q "^CONFIG_PACKAGE_${p}=[my]" .config && { echo "!! 残留 $p"; BADE=1; } || true
            done < ../Config/kmod-cut-extra.txt
            echo "cut_extra 残留标记: $BADE"
            [ "$BADE" = "0" ] || { echo "失败: cut_extra 名单未清干净"; exit 1; }
            grep -q '^CONFIG_PACKAGE_kmod-nf-ipvs=y' .config && echo "  OK nf-ipvs 已保留（keepalived/dockerd 用）" || { echo "失败: kmod-nf-ipvs 丢失"; exit 1; }
            # 调度族必须成组剔除，且核心必须存活
            BADS=$(grep -cE '^CONFIG_PACKAGE_kmod-sched(-(cbs|etf|taprio|mqprio|mqprio-common|dualpi2|drr|prio|skbprio|ets|gred|act-gate|act-pedit|act-police|act-sample|act-vlan|ctinfo|connmark|ipset))?=[ym]' .config || true)
            echo "残留调度族(y/m): $BADS"
            [ "$BADS" = "0" ] || { grep -E '^CONFIG_PACKAGE_kmod-sched(-(cbs|etf|taprio|mqprio|mqprio-common|dualpi2|drr|prio|skbprio|ets|gred|act-gate|act-pedit|act-police|act-sample|act-vlan|ctinfo|connmark|ipset))?=[ym]' .config; echo "失败: 调度族未清干净"; exit 1; }
            grep -q '^CONFIG_PACKAGE_kmod-sched-connmark=y' .config && { echo "失败: kmod-sched-connmark 仍在内建（已改 SQM，应剔除）"; exit 1; } || echo "  OK sched-connmark 已剔除"
            grep -q '^CONFIG_PACKAGE_kmod-sched-bpf=y' .config && echo "  OK sched-bpf(cls_bpf/act_bpf) 已保留" || { echo "失败: kmod-sched-bpf 丢失（daed eBPF 需要）"; exit 1; }
            grep -q '^CONFIG_PACKAGE_kmod-netem=y' .config && { echo "失败: kmod-netem 仍在（会缺 kmod-sched 依赖）"; exit 1; } || echo "  OK netem 已剔除"
            echo "排除项校验（必须全部 is not set）:"
            for p in kmod-ath10k kmod-ath10k-ct r8152 firewall wpad-wolfssl kmod-nss-wifi-drv; do
              grep -q "^# CONFIG_PACKAGE_${p} is not set" .config && echo "  OK $p" || echo "  !! $p 仍被选中"
            done
            # 关键依赖不能被误剔
            for p in kmod-sched-core kmod-sched-cake kmod-nls-utf8 kmod-nls-cp437 \
                     kmod-nls-base kmod-fs-ext4 kmod-fs-vfat kmod-fs-exfat \
                     kmod-mac80211 kmod-ath11k kmod-ath11k-ahb kmod-usb-net kmod-nft-core \
                     nftables-json nftables libnftnl; do
              grep -q "^CONFIG_PACKAGE_${p}=y" .config && echo "  依赖OK $p" || echo "  !! 依赖丢失 $p"
            done
            # 硬断言：nftables-json 提供 nft + libnftables.so.1，
            # firewall4 与 dnsmasq_full_nftset 都靠它，缺了会在打包阶段死
            grep -q "^CONFIG_PACKAGE_nftables-json=y" .config || {
              echo "失败: nftables-json 未选中 → dnsmasq-full 会缺 libnftables.so.1"; exit 1; }
          fi
          # ==== BTF：把 .BTF 段编进内核（占用 12M 内核槽，超限由下一步校验拦）====
          # 注意：BTF 需要“完整”调试信息，REDUCED 会让 pahole 直接失败
          sed -i 's/^# CONFIG_KERNEL_DEBUG_INFO is not set/CONFIG_KERNEL_DEBUG_INFO=y/' .config
          sed -i 's/^CONFIG_KERNEL_DEBUG_INFO_NONE=y/# CONFIG_KERNEL_DEBUG_INFO_NONE is not set/' .config
          sed -i 's/^CONFIG_KERNEL_DEBUG_INFO_REDUCED=y/# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set/' .config
          sed -i 's/^# CONFIG_KERNEL_DEBUG_INFO_BTF is not set/CONFIG_KERNEL_DEBUG_INFO_BTF=y/' .config
          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config || echo 'CONFIG_KERNEL_DEBUG_INFO_BTF=y' >> .config
          echo "BTF 开关: $(grep -c '^CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config) 行; REDUCED 残留: $(grep -c '^CONFIG_KERNEL_DEBUG_INFO_REDUCED=y' .config) 行"
          grep -q '^CONFIG_KERNEL_DEBUG_INFO_BTF=y' .config || { echo "失败: BTF 没打开"; exit 1; }
          [ "$(grep -c '^CONFIG_KERNEL_DEBUG_INFO_REDUCED=y' .config)" = "0" ] || { echo "失败: DEBUG_INFO_REDUCED 仍开，pahole 会失败"; exit 1; }
          # ==== 内核 Kconfig 基线：补上 BTF 相关符号，避免 syncconfig 因 (NEW) 符号而失败 ====
          # 6.18 里 DEBUG_INFO_BTF 在 generic 基线中是 not set，且 DEBUG_INFO_BTF_MODULES 是新符号，
          # 非交互 make syncconfig 遇到 (NEW) 会直接报错退出（Expanded from Makefile:754 syncconfig）
          GC=target/linux/generic/config-6.18
          sed -i 's/^# CONFIG_DEBUG_INFO_BTF is not set/CONFIG_DEBUG_INFO_BTF=y/' "$GC"
          grep -q '^CONFIG_DEBUG_INFO_BTF=y' "$GC" || echo 'CONFIG_DEBUG_INFO_BTF=y' >> "$GC"
          sed -i '/^CONFIG_DEBUG_INFO_BTF_MODULES=y$/d; /^# CONFIG_DEBUG_INFO_BTF_MODULES is not set$/d' "$GC"
          echo '# CONFIG_DEBUG_INFO_BTF_MODULES is not set' >> "$GC"
          echo "generic 基线 BTF 行: $(grep -cE '^CONFIG_DEBUG_INFO_BTF=y$' "$GC") / MODULES 关闭: $(grep -cE '^# CONFIG_DEBUG_INFO_BTF_MODULES is not set' "$GC")"

          echo "==== 校验关键符号 ===="
          grep -E "^CONFIG_TARGET_qualcommax=y|jdcloud_re-ss-01=y|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_PACKAGE_luci-theme-vantage=y|CONFIG_PACKAGE_dnsmasq-full=y|CONFIG_PACKAGE_zram-swap=y|CONFIG_PACKAGE_kmod-usb-storage=y|CONFIG_PACKAGE_kmod-fs-ext4=y" .config || true
          echo "==== 冲突检查（必须全空） ===="
          grep -E "^CONFIG_PACKAGE_(dnsmasq|kmod-fs-ntfs3|kmod-nss-wifi-drv)=y|^CONFIG_ATH11K_NSS_WIFI=y" .config || echo "OK: 无冲突项"
          echo "==== WiFi 路径检查 ===="
          grep -E "^CONFIG_PACKAGE_kmod-ath11k=y|^CONFIG_PACKAGE_kmod-ath11k-ahb=y|^CONFIG_PACKAGE_ipq-wifi-jdcloud_re-ss-01=y|^CONFIG_ATH11K_NSS_WIFI is not set" .config || echo "警告: 公共 WiFi 路径不全"
          if [ "$MODE" = "qca25" ]; then
            grep -q "^CONFIG_PACKAGE_ath11k-firmware-ipq6018=y" .config && echo "OK: QCA 2.5.0.1-03982 已选中" || { echo "失败: QCA 2.5 固件未选中"; exit 1; }
            grep -q "^CONFIG_PACKAGE_ath11k-firmware-ipq6018-ddwrt=y" .config && { echo "失败: ddwrt 2.12 仍被选中"; exit 1; } || echo "OK: ddwrt 未选中"
          else
            grep -q "^CONFIG_PACKAGE_ath11k-firmware-ipq6018-ddwrt=y" .config && echo "OK: DD-WRT 2.12 已选中" || { echo "失败: ddwrt 固件未选中"; exit 1; }
          fi
          # 依赖链闭环强制钉死：ptp→pps（pps_core.ko 缺了 kmod-ptp 打不出来）、usb-hid→hid 核心
          for p in kmod-pps kmod-ptp kmod-hid kmod-hid-generic kmod-usb-hid; do
            grep -q "^CONFIG_PACKAGE_${p}=y" .config || { echo "失败: $p 丢失（有保留包依赖它）"; exit 1; }
          done
          echo "OK: pps/ptp/hid/usb-hid 全在"
          grep -q "^CONFIG_PACKAGE_kmod-nss-wifi-drv=y" .config && echo "警告: NSS 驱动仍在" || echo "OK: NSS 驱动未选中"
          grep -c "^CONFIG_ATH11K_NSS_WIFI is not set" .config | sed 's/^/ATH11K_NSS_WIFI 已关闭行数: /'

      - name: 整族依赖闭环（剔除依赖方，防打包缺 .ko）
        run: |
          cd ./wrt
          python3 "${{ github.workspace }}/Scripts/kmod-closure.py"
          echo "闭环后 kmod 内建: $(grep -c '^CONFIG_PACKAGE_kmod-[A-Za-z0-9_.+-]*=y' .config)"
          echo "闭环后 kmod 独立: $(grep -c '^CONFIG_PACKAGE_kmod-[A-Za-z0-9_.+-]*=m' .config)"

      - name: 冲突筛查（仅 TEST）
        if: ${{ inputs.TEST }}
        run: |
          cd ./wrt
          echo "=== [1] kmod 包定义总数 ==="
          grep -rh "define Package/kmod-" package feeds 2>/dev/null | sed 's/.*define Package\//  /' | sort -u | wc -l
          echo "=== [2] 显式 CONFLICTS / PROVIDES 声明 ==="
          grep -rn "CONFLICTS:=" package feeds 2>/dev/null | sed 's/\/Makefile:/\t/' | head -60 || echo "无"
          echo "=== [3] 重跑 defconfig 抓警告 ==="
          make defconfig 2>&1 | tee /tmp/defcfg.log >/dev/null
          grep -nE "WARNING|duplicate|already defined|conflict|CONFLICT|not available|missing dependency|recursive|Circular" /tmp/defcfg.log | head -80 || echo "无警告"
          echo "=== [4] 选取结果 ==="
          echo "选中 kmod : $(grep -c '^CONFIG_PACKAGE_kmod.*=y' .config)"
          echo "未选 kmod : $(grep -c '^# CONFIG_PACKAGE_kmod.* is not set' .config)"
          echo "=== [5] 未选 kmod 清单（被挤压/被顶掉的都在这） ==="
          grep '^# CONFIG_PACKAGE_kmod.* is not set' .config | sed 's/^# CONFIG_PACKAGE_//;s/ is not set//' | sort | head -300
          echo "=== [6] 体积预估 ==="
          grep -E "^CONFIG_TARGET_ROOTFS_PARTSIZE" .config || true

      - name: Download
        if: ${{ !inputs.TEST }}
        run: |
          cd ./wrt
          make download -j$(nproc)

      - name: Compile
        if: ${{ !inputs.TEST }}
        run: |
          cd ./wrt
          set -o pipefail
          START=$(date +%s)
          ONLY="${{ inputs.ONLY_PKG }}"
          if [ -n "$ONLY" ]; then
            echo "调试模式：只编 $ONLY"
            if make "$ONLY/compile" V=s 2>&1 | tee /tmp/compile.log; then
              echo "单包编译成功"
            else
              echo "::error::单包编译失败"
              mkdir -p logs && cp -f /tmp/compile.log logs/compile-fail.log
              tail -80 /tmp/compile.log
              exit 1
            fi
            exit 0
          fi
          # 5 小时 40 分护栏：到点由 timeout 杀掉 make，走进失败分支把日志落盘，
          # 避免被 GitHub 6h 硬顶直接砍掉导致日志全丢
          if timeout 20400 make -j$(nproc) 2>&1 | tee /tmp/compile.log; then
            echo "编译成功，用时 $(( $(date +%s) - START ))s"
          else
            echo "::error::并行编译失败（不再回落 -j1 重编，避免单线程空跑数小时）"
            mkdir -p logs && cp -f /tmp/compile.log logs/compile-fail.log
            tail -400 /tmp/compile.log > logs/compile-tail.log
            echo "==== 内核/镜像相关线索（BTF、超限、pahole）===="
            grep -nE "too big|pahole|BTF|BTFIDS|vmlinux|No space left|Cannot find|out of memory" /tmp/compile.log | tail -40 || true
            echo "==== target/linux 失败上下文 ===="
            grep -n "target/linux" /tmp/compile.log | tail -10 || true
            echo "==== 磁盘余量 ===="
            df -h . / | tail -3
            echo "==== 失败包复现（V=s 抓真因） ===="
            FAILPKG=$(grep -oE "ERROR: (feeds|package|target)/[^ ]+ failed to build" /tmp/compile.log | head -1 | awk '{print $2}' || true)
            echo "失败包：$FAILPKG"
            case "$FAILPKG" in
              *target/linux*)
                echo "==== 内核（target/linux）失败：原地 V=s 复现 ===="
                make target/linux/compile V=s 2>&1 | tee logs/target-fail.log | tail -300 || true
                echo "==== 内核错误线索 ===="
                grep -nE "too big|Image too big|pahole|BTF|BTFIDS|vmlinux|Error [0-9]|error:|Error:" logs/target-fail.log | tail -60 || true
                ;;
              "")
                echo "==== 无包级错误线索：先怀疑 package/install（打包/库依赖）===="
                make package/install V=s 2>&1 | tee logs/install-fail.log | tail -200 || true
                echo "==== install 阶段线索 ===="
                grep -nE "missing dependencies|Collected error|conflict|Cannot find|No such file|not found|Error [0-9]" logs/install-fail.log | tail -60 || true
                if ! grep -qE "missing dependencies|Collected error|conflict|Error [0-9]" logs/install-fail.log; then
                  echo "==== install 阶段未复现，回落 target/linux ===="
                  make target/linux/compile V=s 2>&1 | tee logs/target-fail.log | tail -200 || true
                  grep -nE "too big|pahole|BTF|Error [0-9]" logs/target-fail.log | tail -40 || true
                fi
                ;;
              *)
                make "$FAILPKG/compile" V=s 2>&1 | tee logs/pkg-fail.log | tail -200 || true
                grep -nE "missing dependencies|Error [0-9]|error:" logs/pkg-fail.log | tail -40 || true
                ;;
            esac
            echo "==== 错误上下文 ===="
            grep -nE "Error [0-9]+|error:|ERROR:|No rule to make|duplicate package|already defined" /tmp/compile.log | tail -40 || true
            echo "==== 失败包线索 ===="
            grep -oE "make\[[0-9]+\]: \*\*\* \[[^]]+\]" /tmp/compile.log | tail -20 || true
            echo "==== 最后 60 行 ===="
            tail -60 /tmp/compile.log
            exit 1
          fi

      - name: 内核体积实测（12M 校验；超了自动抛弃 BTF 同轮重编）
        run: |
          cd ./wrt
          BDL=$(find build_dir -maxdepth 1 -type d -name 'linux-qualcommax_ipq60xx' | head -1)
          [ -n "$BDL" ] || { echo "失败: 内核 build_dir 不存在"; exit 1; }
          measure() {
            K="$BDL/arch/arm64/boot/Image.gz"; [ -f "$K" ] || K="$BDL/arch/arm64/boot/Image"
            [ -f "$K" ] || { echo 0; return; }
            KSZ=$(stat -c%s "$K"); DSZ=0
            for d in "$BDL"/arch/arm64/boot/dts/qcom/*jdcloud*.dtb; do [ -f "$d" ] && { DSZ=$(stat -c%s "$d"); break; }; done
            echo $(( (KSZ + DSZ + 1023) / 1024 ))
          }
          TOT=$(measure)
          echo "实测内核合计: ${TOT} KiB / 12M 槽 = 12288 KiB"
          if [ "${TOT}" -le 0 ]; then echo "失败: 找不到内核镜像"; exit 1; fi
          if [ "${TOT}" -gt 12288 ]; then
            echo "==== 超 12M（${TOT} > 12288）→ 放弃 BTF，同轮重编 ===="
            sed -i 's/^CONFIG_KERNEL_DEBUG_INFO_BTF=y/# CONFIG_KERNEL_DEBUG_INFO_BTF is not set/' .config
            grep -q '^# CONFIG_KERNEL_DEBUG_INFO_BTF is not set' .config || echo '# CONFIG_KERNEL_DEBUG_INFO_BTF is not set' >> .config
            GC=target/linux/generic/config-6.18
            sed -i 's/^CONFIG_DEBUG_INFO_BTF=y/# CONFIG_DEBUG_INFO_BTF is not set/' "$GC"
            grep -q '^# CONFIG_DEBUG_INFO_BTF is not set' "$GC" || echo '# CONFIG_DEBUG_INFO_BTF is not set' >> "$GC"
            echo "关闭 BTF 完成，清理内核重编（包已缓存，只重编内核+镜像）"
            make target/linux/clean
            timeout 20400 make -j"$(nproc)" world
            TOT=$(measure)
            echo "无 BTF 实测: ${TOT} KiB"
            [ "${TOT}" -le 12288 ] || { echo "失败: 放弃 BTF 后仍超 12M（${TOT} KiB）"; exit 1; }
            echo "BTF_MODE=no-btf" >> "$GITHUB_ENV"
            echo "- **结论**: 不带 BTF，${TOT} KiB / 12288 KiB 通过（余 $((12288-TOT)) KiB）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "BTF_MODE=btf" >> "$GITHUB_ENV"
            echo "- **结论**: 带 BTF，${TOT} KiB / 12288 KiB 通过（余 $((12288-TOT)) KiB）" >> "$GITHUB_STEP_SUMMARY"
          fi
          VML=$(find "$BDL" -maxdepth 1 -name 'vmlinux' | head -1)
          if [ -f "$VML" ]; then
            echo "vmlinux: $(stat -c%s "$VML" | awk '{printf "%.1f MiB", $1/1048576}')"
            readelf -SW "$VML" | grep -E '\.BTF' | head -2 || echo "无 .BTF 段"
          fi
          KC=$(find "$BDL" -maxdepth 2 -name '.config' | head -1)
          if [ -f "$KC" ]; then
            echo "内核特性 =y: $(grep -c '^CONFIG_[A-Za-z0-9_]*=y' "$KC")  =m: $(grep -c '^CONFIG_[A-Za-z0-9_]*=m' "$KC")  条目: $(grep -c '^CONFIG_' "$KC")"
          fi
          echo "kmod 内建: $(grep -c '^CONFIG_PACKAGE_kmod-[A-Za-z0-9_.+-]*=y' .config)  独立: $(grep -c '^CONFIG_PACKAGE_kmod-[A-Za-z0-9_.+-]*=m' .config)"

      - name: 断言无线固件已落地（${{ inputs.WIFI_FW }}）
        if: ${{ !inputs.TEST }}
        run: |
          cd ./wrt
          MODE="${{ inputs.WIFI_FW }}"
          FW=$(ls -1d ./build_dir/target-*/root-*/lib/firmware/IPQ6018 2>/dev/null | head -1)
          echo "固件目录: $FW"
          ls -l "$FW" | head -20
          SIZE=$(stat -c %s "$FW/q6_fw.b03" 2>/dev/null || echo 0)
          echo "q6_fw.b03=$SIZE"
          if [ "$MODE" = "qca25" ]; then
            [ "$SIZE" = "2559184" ] || { echo "失败: q6_fw.b03 不是 2.5.0.1-03982 分片"; exit 1; }
            echo "OK: 官方 2.5.0.1-03982 固件已落地"
          else
            [ "$SIZE" = "2909712" ] || { echo "失败: q6_fw.b03 不是 2.12 分片"; exit 1; }
            echo "OK: DD-WRT 2.12-01460 固件已落地"
          fi

      - name: Collect
        if: always()
        run: |
          cd ./wrt
          rm -rf ./upload && mkdir -p ./upload/firmware ./upload/packages
          cp -f .config ./upload/firmware/Config-"$WRT_CONFIG"-"$WRT_DATE".txt

          # 固件本体：镜像 + manifest（单独一处，不再混包）
          find ./bin/targets -type f \( -name "*.bin" -o -name "*.itb" -o -name "*.img" -o -name "*.manifest" \) \
            -exec cp -f {} ./upload/firmware/ \;

          # 安装包：.apk 单独打包成一个压缩包
          find ./bin/targets -type f -name "*.apk" -exec cp -f {} ./upload/packages/ \;
          find ./staging_dir/packages -type f -name "packages.adb" -exec cp -f {} ./upload/packages/ \; 2>/dev/null || true
          if [ -n "$(ls -A ./upload/packages 2>/dev/null)" ]; then
            tar -czf ./upload/packages-"$WRT_CONFIG"-"$WRT_DATE".tar.gz -C ./upload/packages .
          fi

          echo "==== 固件 ===="
          ls -lh ./upload/firmware || true
          echo "==== 安装包 ===="
          ls -1 ./upload/packages | wc -l
          ls -lh ./upload/*.tar.gz || true

      - name: 落内核符号依赖表（Module.symvers / modules.dep）
        if: always()
        run: |
          cd ./wrt
          OUT="$PWD/upload/kmoddeps"
          rm -rf "$OUT"; mkdir -p "$OUT"

          # 1) Module.symvers：每个导出符号 → 导出它的模块（vmlinux=内建）
          find ./build_dir -maxdepth 5 -name Module.symvers -type f 2>/dev/null | while read -r f; do
            echo "取到 $f"
            cp -f "$f" "$OUT/Module.symvers"
          done

          # 2) modules.* 元数据（只有 =m 模块才有内容）
          for m in modules.dep modules.builtin modules.builtin.modinfo modules.symbols modules.alias; do
            p=$(find ./build_dir ./staging_dir -name "$m" -type f 2>/dev/null | head -1)
            [ -n "$p" ] && cp -f "$p" "$OUT/$m"
          done

          # 3) 内核 .config（确认 MODULES / MODULE_SIG 等开关）
          p=$(find ./build_dir -maxdepth 5 -path '*linux-*' -name .config -type f 2>/dev/null | head -1)
          [ -n "$p" ] && cp -f "$p" "$OUT/kernel-config.txt"

          # 4) 每个模块的 .mod（含 required_symbols 线索），整体打包免name冲突
          find ./build_dir -maxdepth 6 -name '*.mod' -type f -print0 2>/dev/null \
            | tar --null -czf "$OUT/mods.tar.gz" -T - 2>/dev/null || true

          echo "==== 落盘结果 ===="
          ls -lh "$OUT" || true
          if [ -s "$OUT/Module.symvers" ]; then
            echo "Module.symvers 符号条数: $(wc -l < "$OUT/Module.symvers")"
            echo "其中 vmlinux 内建导出: $(awk -F'\t' '$2=="vmlinux"' "$OUT/Module.symvers" | wc -l)"
            echo "其中 .ko 导出: $(awk -F'\t' '$2!="vmlinux"' "$OUT/Module.symvers" | wc -l)"
          else
            echo "警告: 未取到 Module.symvers（多半是没编到内核阶段）"
          fi

      - name: Upload Kmod Deps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmod-deps-${{ github.run_id }}
          path: ./wrt/upload/kmoddeps/
          retention-days: 30

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: ./wrt/logs/

      - name: Upload Images Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.run_id }}
          path: ./wrt/upload/firmware/
          retention-days: 7

      - name: Release Firmware
        if: ${{ success() && !inputs.TEST }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: L0-${{ env.WRT_DATE }}
          files: ./wrt/upload/firmware/*
          body: |
            京东云亚瑟 AX1800 Pro · L0 底座（无 NSS）

            源码：${{ env.SOURCE_REPO }} @ ${{ env.SOURCE_BRANCH }} (${{ env.SRC_HASH }})
            平台：qualcommax / ipq60xx / jdcloud_re-ss-01
            内核槽：12M ｜ 根分区：2048M
