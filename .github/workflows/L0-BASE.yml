# L0 底座固件：京东云亚瑟 AX1800 Pro（qualcommax/ipq60xx）
# 单一栈：无 NSS / nftables / dnsmasq-full / vantage 主题 / ext4 U盘层
# 产物：squashfs sysupgrade + factory.bin + .manifest + 最终 .config

name: L0-BASE

on:
  workflow_dispatch:
    inputs:
      TEST:
        description: '仅生成并校验配置，不编译'
        type: boolean
        default: false
        required: false

env:
  SOURCE_REPO: https://github.com/VIKINGYFY/immortalwrt.git
  SOURCE_BRANCH: owrt
  WRT_CONFIG: L0-AX1800
  WRT_DATE: ${{ github.run_id }}

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Host
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -yqq purge firefox >/dev/null 2>&1 || true
          sudo apt-get -yqq update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang cmake cpio \
            curl device-tree-compiler dos2unix file flex g++-multilib gawk gcc-multilib \
            genisoimage gettext git jq libelf-dev libncurses-dev libssl-dev lld llvm \
            ninja-build patch perl pkgconf python3 python3-dev python3-pyelftools \
            rsync swig unzip wget xz-utils zlib1g-dev zstd
          sudo timedatectl set-timezone Asia/Shanghai

      - name: Clone Source
        run: |
          git clone --depth=1 --single-branch -b "$SOURCE_BRANCH" "$SOURCE_REPO" ./wrt
          cd ./wrt
          echo "SRC_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Feeds
        run: |
          cd ./wrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Vantage Theme
        run: |
          git clone --depth=1 https://github.com/anothaDev/luci-theme-vantage.git /tmp/vantage
          cp -r /tmp/vantage/luci-theme-vantage ./wrt/package/
          test -f ./wrt/package/luci-theme-vantage/Makefile

      - name: Kernel Slot 12M
        run: |
          cd ./wrt
          MK=./target/linux/qualcommax/image/ipq60xx.mk
          sed -i 's/KERNEL_SIZE := 6144k/KERNEL_SIZE := 12288k/g' "$MK"
          grep -n "KERNEL_SIZE" "$MK" | head

      - name: Apply Config
        run: |
          cd ./wrt
          [ -d ../files ] && cp -rf ../files/. ./
          cat "../Config/$WRT_CONFIG.txt" >> .config
          make defconfig -j$(nproc)
          echo "==== 校验关键符号 ===="
          grep -E "^CONFIG_TARGET_qualcommax=y|jdcloud_re-ss-01=y|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_PACKAGE_luci-theme-vantage=y|CONFIG_PACKAGE_dnsmasq-full=y|CONFIG_PACKAGE_zram-swap=y|CONFIG_PACKAGE_kmod-usb-storage=y|CONFIG_PACKAGE_kmod-fs-ext4=y" .config || true
          echo "==== 冲突检查（必须全空） ===="
          grep -E "^CONFIG_PACKAGE_(kmod-qca-nss-dp|dnsmasq|kmod-fs-exfat|kmod-fs-ntfs3)=y" .config || echo "OK: 无冲突项"

      - name: Download
        if: ${{ !inputs.TEST }}
        run: |
          cd ./wrt
          make download -j$(nproc)

      - name: Compile
        if: ${{ !inputs.TEST }}
        run: |
          cd ./wrt
          make -j$(nproc) || make -j1 V=s

      - name: Collect
        if: always()
        run: |
          cd ./wrt
          mkdir -p ./upload
          cp -f .config ./upload/Config-"$WRT_CONFIG"-"$WRT_DATE".txt
          find ./bin/targets -type f -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -f {} + 2>/dev/null || true
          find ./bin/targets -type f -exec cp -f {} ./upload/ + 2>/dev/null || true
          ls -lh ./upload || true

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: ./wrt/logs/

      - name: Release
        if: ${{ success() && !inputs.TEST }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: L0-${{ env.WRT_DATE }}
          files: ./wrt/upload/*
          body: |
            京东云亚瑟 AX1800 Pro · L0 底座（无 NSS）

            源码：${{ env.SOURCE_REPO }} @ ${{ env.SOURCE_BRANCH }} (${{ env.SRC_HASH }})
            平台：qualcommax / ipq60xx / jdcloud_re-ss-01
            内核槽：12M ｜ 根分区：2048M
            主题：vantage ｜ DNS：dnsmasq-full ｜ U盘层：ext4 + vfat
            NSS：全部关闭

            刷机用 *sysupgrade.bin（保留配置升级）或 *factory.bin（首次/救砖）。
